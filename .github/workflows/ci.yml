name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: job_agent_test # o nome DEVE terminar em _test (guard dos testes)
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d job_agent_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://ci:ci-only-password@localhost:5432/job_agent_test
      REQUIRE_TEST_DATABASE: "1" # sem banco de teste => FALHA, não skip
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: Validate D2-E1.4 guarded operational CLI (no DB access)
        run: |
          python -m py_compile ../scripts/d2e14_operational_gate.py
          python ../scripts/d2e14_operational_gate.py --help
          python ../scripts/d2e14_operational_gate.py self-test-headers
          python -m py_compile ../scripts/d2e15_proxy_policy.py
          python ../scripts/d2e15_proxy_policy.py --bind 127.0.0.1 --trusted-proxy 127.0.0.1 --https-origin https://app.example.com
          python -m py_compile ../scripts/d2e151_migration_gate.py ../scripts/d2e151_operational_probe.py
          python ../scripts/d2e151_operational_probe.py --help
      - name: Migrations (CLI path) upgrade -> downgrade -> upgrade
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  audit:
    # Informativo (não bloqueia): uma advisory nova não deve quebrar o merge de uma mudança sem relação.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "backend" pip-audit
      - run: pip-audit --skip-editable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm audit --omit=dev
        working-directory: frontend

  sandbox-smoke:
    # Runs ONLY on an ephemeral GitHub runner with synthetic documents.
    # Never access a Codespaces PostgreSQL instance or a real resume.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e backend
      - name: Build isolated resume parser image
        run: docker build -f backend/Dockerfile.resume-parser -t job-agent-resume-parser:d2e2d1 backend
      - name: Verify synthetic parsing, filesystem and network denial
        run: python scripts/d2e2d1_sandbox_smoke.py

  browser-smoke:
    # Chromium UI proof using intercepted synthetic HTTP only; DB acceptance is
    # performed separately by backend tests on disposable PostgreSQL.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
        working-directory: frontend
      - run: pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Start isolated Vite frontend and exercise synthetic browser review
        env:
          VITE_API_URL: http://127.0.0.1:5173
        run: |
          set -euo pipefail
          (cd frontend && npm run dev -- --host 127.0.0.1 > /tmp/job-agent-vite.log 2>&1) &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5173/ >/dev/null
          python scripts/d2e2d1d_browser_smoke.py
